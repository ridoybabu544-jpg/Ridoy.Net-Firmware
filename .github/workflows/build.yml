name: Ridoy.Net Firmware Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout project configuration
        uses: actions/checkout@v4

      - name: Checkout firmware source branch
        uses: actions/checkout@v4
        with:
          repository: ridoybabu544-jpg/Ridoy.Net-Firmware
          ref: source
          path: source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man htop kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales mc nano pkg-config ppp-dev python3 python3-docutils sshpass texinfo unzip uuid uuid-dev vim wget xxd zlib1g-dev

      - name: Build toolchain
        working-directory: source/toolchain
        run: ./build_toolchain.sh

      - name: Configure TP-Link TL-WR845N V4
        working-directory: source/trunk
        run: |
          test -f configs/templates/tplink/tl_wr845n-v4.config
          cp configs/templates/tplink/tl_wr845n-v4.config .config

      - name: Build firmware
        working-directory: source/trunk
        run: ./build_firmware.sh

      - name: Collect firmware images
        if: always()
        shell: bash
        run: |
          mkdir -p output
          if [ -d source/trunk/images ]; then
            find source/trunk/images -maxdepth 2 -type f -print0 | while IFS= read -r -d '' file; do
              cp -v "$file" output/
            done
          fi
          ls -lah output

      - name: Validate firmware image size and create checksums
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          output = Path("output")
          images = sorted(p for p in output.glob("*.bin") if p.is_file())
          if not images:
              sys.exit("ERROR: no .bin firmware image found")

          # TL-WR845N V4 board partition: offset 0x10000, size 0x3C0000.
          max_size = 0x3C0000
          lines = []
          for image in images:
              size = image.stat().st_size
              if size <= 0 or size > max_size:
                  sys.exit(f"ERROR: {image.name} size {size} exceeds firmware partition limit {max_size}")
              digest = hashlib.sha256(image.read_bytes()).hexdigest()
              lines.append(f"{digest}  {image.name}")
              print(f"OK: {image.name}: {size} bytes <= {max_size} bytes")
          (output / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          (output / "BUILD-CHECK.txt").write_text(
              "Target: TP-Link TL-WR845N V4 (UN)\n"
              "Expected TP-Link HWID: 0x08450004\n"
              "Firmware partition: offset 0x10000, size 0x3C0000\n"
              "Check: image size only; this does NOT certify cross-firmware upgrade compatibility.\n"
          )
          PY

      - name: Create experimental TFTP recovery image
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          out = Path("output")
          candidates = sorted(
              p for p in out.glob("TL_WR845N-V4*.bin")
              if p.is_file() and p.name != "tp_recovery.bin"
          )
          if len(candidates) != 1:
              sys.exit(f"ERROR: expected exactly one TL_WR845N-V4 firmware .bin, found {len(candidates)}")

          source = candidates[0]
          payload = source.read_bytes()
          # Community-documented TL-WR845N V4 TFTP packaging: prepend 0x10000 zero bytes.
          # This creates a test artifact only; it does not prove bootloader acceptance.
          recovery = bytes(0x10000) + payload
          limit = 0x3D0000  # end of the firmware region, before Storage partition
          if len(recovery) > limit:
              sys.exit(f"ERROR: recovery image {len(recovery)} bytes exceeds {limit}-byte TFTP region limit")

          target = out / "tp_recovery.bin"
          target.write_bytes(recovery)
          check = target.read_bytes()
          if check[:0x10000] != bytes(0x10000) or check[0x10000:] != payload:
              sys.exit("ERROR: recovery image byte-for-byte validation failed")

          digest = hashlib.sha256(check).hexdigest()
          with (out / "SHA256SUMS.txt").open("a") as f:
              f.write(f"{digest}  tp_recovery.bin\n")
          (out / "RECOVERY-CHECK.txt").write_text(
              "File: tp_recovery.bin\n"
              "Target: TP-Link TL-WR845N V4 (UN)\n"
              "Packaging: 0x10000 zero-byte prefix + standard firmware image\n"
              f"Source: {source.name}\n"
              f"Size: {len(check)} bytes\n"
              f"SHA-256: {digest}\n"
              "Validation: prefix and payload byte comparison passed; size limit passed.\n"
              "WARNING: packaging validation only. TFTP bootloader acceptance and on-device recovery have NOT been tested. Do not flash until independently verified.\n"
          )
          print(f"OK: created {target} ({len(check)} bytes)")
          print(f"SHA-256: {digest}")
          PY

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ridoy-Net-TL-WR845N-V4
          path: output/*
          if-no-files-found: warn
          retention-days: 7
