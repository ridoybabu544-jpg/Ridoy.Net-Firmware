name: Ridoy.Net Padavan Build - TL-WR845N V4

on:
  workflow_dispatch:
  push:
    branches: [ main, source ]

permissions:
  contents: read

jobs:
  build:
    name: Build TL-WR845N V4 (MT7628 / 4 MB)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout project configuration
        uses: actions/checkout@v4

      - name: Checkout Padavan source
        uses: actions/checkout@v4
        with:
          repository: ridoybabu544-jpg/Ridoy.Net-Firmware
          ref: source
          path: source

      - name: Verify exact board configuration and 4 MB flash target
        working-directory: source/trunk
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="configs/templates/tplink/tl_wr845n-v4.config"
          BOARD="configs/boards/TPLINK/TL_WR845N-V4"
          test -f "$TEMPLATE"
          test -f "$BOARD/board.h"
          test -f "$BOARD/kernel-3.4.x.config"
          grep -Fq 'CONFIG_FIRMWARE_PRODUCT_ID="TL_WR845N-V4"' "$TEMPLATE"
          grep -Fq 'CONFIG_RT2880_FLASH_4M=y' "$BOARD/kernel-3.4.x.config"
          echo "Verified Padavan board profile: TL_WR845N-V4"
          echo "Verified kernel flash setting: 4 MB"
          cp "$TEMPLATE" .config

      - name: Apply Ridoy.Net web branding
        working-directory: source/trunk/user/www
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Makefile')
          lines = p.read_text().splitlines()
          found_url = found_copy = False
          for i, line in enumerate(lines):
              if line.startswith('PROJECT_HOME_URL='):
                  lines[i] = 'PROJECT_HOME_URL="https:\\/\\/github.com\\/ridoybabu544-jpg\\/Ridoy.Net-Firmware"'
                  found_url = True
              elif line.startswith('LABEL_COPYRIGHT_TEXT='):
                  lines[i] = 'LABEL_COPYRIGHT_TEXT="Ridoy.Net Firmware. Personal build. Compilation Time: `date +\'%d.%m.%Y %H:%M:%S\'`"'
                  found_copy = True
          if not (found_url and found_copy):
              raise SystemExit('Expected branding markers not found; refusing to modify source')
          p.write_text('\n'.join(lines) + '\n')
          print('Ridoy.Net web branding applied')
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake autopoint bison build-essential ca-certificates cmake cpio curl dos2unix doxygen fakeroot flex gawk gettext git gperf help2man htop kmod libarchive-tools libblkid-dev libc-ares-dev libcurl4-openssl-dev libdevmapper-dev libev-dev libevent-dev libexif-dev libflac-dev libgmp3-dev libid3tag0-dev libidn2-dev libjpeg-dev libkeyutils-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libogg-dev libsqlite3-dev libssl-dev libsystemd-dev libtool libtool-bin libudev-dev libunbound-dev libvorbis-dev libxml2-dev locales mc nano pkg-config ppp-dev python3 python3-docutils sshpass texinfo unzip uuid uuid-dev vim wget xxd zlib1g-dev

      - name: Build MIPS toolchain
        working-directory: source/toolchain
        run: ./build_toolchain.sh

      - name: Build TL-WR845N V4 firmware
        working-directory: source/trunk
        run: ./build_firmware.sh

      - name: Collect firmware images
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [ -d source/trunk/images ]; then
            find source/trunk/images -maxdepth 2 -type f -print0 | while IFS= read -r -d '' file; do
              cp -v "$file" output/
            done
          fi
          ls -lah output

      - name: Validate image size and create checksums
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import sys

          output = Path("output")
          images = sorted(p for p in output.glob("*.bin") if p.is_file())
          if len(images) != 1:
              sys.exit(f"ERROR: expected exactly one .bin image, found {len(images)}")

          # Conservative firmware payload ceiling for a 4 MiB flash layout.
          max_size = 0x3C0000
          image = images[0]
          size = image.stat().st_size
          if size <= 0 or size > max_size:
              sys.exit(f"ERROR: {image.name} size {size} exceeds configured ceiling {max_size}")

          data = image.read_bytes()
          # Verify the legacy TP-Link header hardware ID emitted by this board target.
          hwid = int.from_bytes(data[0x34:0x38], "big")
          if hwid == 0 or hwid == 0xFFFFFFFF:
              sys.exit(f"ERROR: invalid TP-Link image header HWID 0x{hwid:08X}")

          digest = hashlib.sha256(data).hexdigest()
          (output / "SHA256SUMS.txt").write_text(f"{digest}  {image.name}\\n")
          (output / "BUILD-CHECK.txt").write_text(
              "Build profile: TP-Link TL-WR845N V4 / TL_WR845N-V4\\n"
              "Intended retail variant: EU V6.20 (not independently proven by board profile)\\n"
              "SoC: MediaTek MT7628\\n"
              "Configured SPI flash size: 4 MB\\n"
              f"Image header HWID at offset 0x34: 0x{hwid:08X}\\n"
              f"Image: {image.name}\\nSize: {size} bytes\\nSHA-256: {digest}\\n"
              "WARNING: This is a Padavan image, not TP-Link stock firmware. The stock TP-Link web updater may reject it (including error 4506).\\n"
              "No safe installation method or bootloader recovery procedure is verified for this exact EU V6.20 unit. Do not flash until confirmed.\\n"
          )
          print(f"OK: {image.name}; TL-WR845N V4 board profile; image HWID 0x{hwid:08X}; {size} bytes; SHA-256 {digest}")
          PY

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ridoy-Net-TL-WR845N-V4
          path: output/*
          if-no-files-found: error
          retention-days: 7
